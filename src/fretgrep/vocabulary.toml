# Vokabular für den Dateinamen-Parser.
#
# [vocabulary.<kategorie>]: kanonischer Wert = Liste der Schreibweisen
# (klein geschrieben, Mehrwort-Schreibweisen mit Leerzeichen).
# Links steht, was als Tag gespeichert wird, z. B. der volle Name. Rechts
# steht alles, was im Dateinamen dafür stehen kann. Fehlt rechts die
# Kurzform, wird sie im Dateinamen nicht mehr erkannt:
#     "jimmy raney" = ["raney", "jimmy raney"]
# Treffer hier gelten als sicher (Konfidenz 0.9).
#
# [[ambiguous]]: Schreibweisen, die mehrdeutig sind (Konfidenz 0.5).
#
# [descriptions]: kanonischer Wert = kurze Erklärung. Sie wird für die
# Suche nach Bedeutung mit eingebettet, damit z. B. "Spuren übereinander"
# zu "looper" findet. Nach einer Änderung "fretgrep embed" ausführen.
#
# [stopwords]: Füllwörter, die weder Tag noch "nicht erkannt" sind.

[vocabulary.progression]
"ii-V-I" = ["251", "2 5 1"]

