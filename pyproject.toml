[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fretgrep"
version = "0.1.0"
description = "Makes guitar lick recordings searchable."
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "mutagen>=1.47",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pylint",
]
transcribe = [
    "faster-whisper>=1.1",
]
# basic-pitch itself is installed separately with --no-deps, because it
# declares TensorFlow as a requirement; see docs/benutzung.md.
notes = [
    "onnxruntime>=1.20",
    "librosa>=0.10",
    "pretty_midi>=0.2.10",
    "resampy<0.4.3",
    "mir_eval>=0.7",
    "scipy>=1.11",
    "setuptools<81",
]

[project.scripts]
fretgrep = "fretgrep.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fretgrep = [
    "vocabulary.toml",
    "migrations/script.py.mako",
    "migrations/versions/*.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
